<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VERTIX — loop</title>

<style>
/* =====================================================================
   VERTIX · animação em loop para TVs
   Ciclo de 15s: o anel se desenha (1,9s) → VTX aparece (2,3s) → a logo
   fica PARADA → um brilho passa aos 5s → fica parada de novo até 13,8s
   → fade e repete. Cerca de 10s dos 15 sao com a logo estatica.
   Para o tema escuro: troque  <body class="light">  por  <body class="dark">
   (ou aperte a tecla D com a página aberta).
   ===================================================================== */

@property --sweep {
  syntax: '<percentage>';
  inherits: false;
  initial-value: 102%;
}

:root {
  --dur: 15s;         /* duração de um ciclo completo.  Aumentar este número
                         estica TUDO junto (entrada, brilho e pausa) na mesma
                         proporção — a pausa cresce, mas a entrada fica mais
                         lenta também. Para mexer só na pausa, veja os
                         comentários em @keyframes cycle, lá embaixo. */
  --tamanho: 52vmin;  /* tamanho da logo (52% da altura da TV) */
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  cursor: none;                 /* esconde o mouse na TV */
}

body {
  display: grid;
  place-items: center;
  font-family: system-ui, sans-serif;
}

body.light {
  background: radial-gradient(circle at 50% 44%, #ffffff 0%, #f0f3f6 62%, #e3e8ee 100%);
}

body.dark {
  background: radial-gradient(circle at 50% 44%, #18232f 0%, #0c1219 62%, #070a0e 100%);
}

/* ---------------------------------------------------------------
   Camada 1 — deriva lenta (71s).
   Move a logo alguns pixels devagar para evitar burn-in em telas
   OLED que ficam ligadas o dia inteiro. Imperceptível ao olho.
   --------------------------------------------------------------- */
.drift {
  animation: drift 71s linear infinite;
}

/* Camada 2 — respiração contínua, sincronizada com o ciclo */
.breath {
  animation: breath var(--dur) ease-in-out infinite;
}

/* Camada 3 — fade final do ciclo, antes de reiniciar */
.cycle {
  animation: cycle var(--dur) ease-in-out infinite;
}

.logo {
  position: relative;
  width: var(--tamanho);
  height: var(--tamanho);
}

.layer {
  position: absolute;
  inset: 0;
  background-position: center;
  background-repeat: no-repeat;
  background-size: contain;
}

body.dark .shine {
  background-image: linear-gradient(102deg,
      rgba(255,255,255,0) 38%,
      rgba(255,255,255,.55) 50%,
      rgba(255,255,255,0) 62%);
}

/* --- brilho difuso atrás da logo, só no tema escuro --------------- */
.glow {
  position: absolute;
  inset: -18%;
  z-index: -1;
  border-radius: 50%;
  background: radial-gradient(circle,
      rgba(46,132,180,.20) 0%, rgba(120,175,60,.12) 45%, transparent 70%);
  opacity: 0;
  animation: glow var(--dur) ease-in-out infinite;
}
body.light .glow { display: none; }

/* =====================  linha do tempo  ========================== */

/* As porcentagens abaixo são fração do ciclo de 15s.
   Ao lado de cada uma está o instante em segundos, para facilitar. */

@keyframes ringDraw {
  0%     { --sweep: 0%;   opacity: 0; animation-timing-function: cubic-bezier(.42,0,.18,1); }
  1.2%   { opacity: 1; }                    /* 0,18s */
  12.6%  { --sweep: 102%; }                 /* 1,89s — anel completo */
  100%   { --sweep: 102%; opacity: 1; }
}

@keyframes lettersIn {
  0%, 7.8% { opacity: 0; transform: translateY(1.4%) scale(1.05);
             animation-timing-function: cubic-bezier(.22,.9,.28,1); }   /* 1,17s */
  15%      { opacity: 1; transform: none; } /* 2,25s — logo inteira no ar */
  100%     { opacity: 1; transform: none; }
}

@keyframes shine {
  0%, 33.3% { background-position: 170% 0; opacity: 0; }   /* 5,00s */
  34.7%     { opacity: 1; }                                /* 5,20s */
  42%       { opacity: 1; }                                /* 6,30s */
  43.3%     { background-position: -70% 0; opacity: 0; }    /* 6,50s */
  100%      { background-position: -70% 0; opacity: 0; }
}

@keyframes breath {
  0%, 100% { transform: scale(1); }
  56%      { transform: scale(1.018); }
}

/* AQUI é onde se regula o tempo de logo parada.
   O 92% é o instante em que a logo começa a sumir (0,92 × 15s = 13,8s).
   Aumentar esse número = mais tempo parada. Diminuir = menos. */
@keyframes cycle {
  0%, 92%   { opacity: 1; transform: scale(1); }      /* 13,80s */
  98%, 100% { opacity: 0; transform: scale(1.03); }   /* 14,70s */
}

@keyframes glow {
  0%, 8%    { opacity: 0; }
  20%, 88%  { opacity: 1; }
  98%, 100% { opacity: 0; }
}

@keyframes drift {
  0%   { transform: translate(0, 0); }
  25%  { transform: translate(1.1vmin, -0.9vmin); }
  50%  { transform: translate(-1vmin, 1.1vmin); }
  75%  { transform: translate(0.9vmin, 1vmin); }
  100% { transform: translate(0, 0); }
}
</style>
</head>

<body class="light">

  <div class="drift">
    <div class="breath">
      <div class="cycle">
        <div class="logo">
          <div class="glow"></div>
          <div class="layer ring"></div>
          <div class="layer letters"></div>
          <div class="layer shine"></div>
        </div>
      </div>
    </div>
  </div>

<script>
// Congela um quadro exato do ciclo, para conferir a arte:
//   abra a pagina com  ?t=3.5   (3,5 segundos do ciclo de 15s)
var _t = new URLSearchParams(location.search).get('t');
if (_t !== null) {
  window.addEventListener('load', function () {
    document.getAnimations().forEach(function (a) {
      a.pause();
      a.currentTime = parseFloat(_t) * 1000;
    });
  });
}

// Atalhos para operar na TV:
//   D = alterna tema claro / escuro     F ou clique = tela cheia
document.addEventListener('keydown', function (e) {
  var k = e.key.toLowerCase();
  if (k === 'd') {
    document.body.classList.toggle('dark');
    document.body.classList.toggle('light');
  }
  if (k === 'f') toggleFullscreen();
});
document.addEventListener('click', toggleFullscreen);

function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(function () {});
}
</script>
